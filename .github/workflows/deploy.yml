name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main
      - claude/analyze-code-bugs-Jt2CO
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      # ── Backend ────────────────────────────────────────────
      - name: 📦 Archive backend
        run: |
          mkdir -p temp/backend-deploy
          rsync -av --exclude='node_modules' --exclude='dist' --exclude='.git' backend/ temp/backend-deploy/
          # Include nginx config so VPS always gets the latest version
          cp nginx-trichology.conf temp/backend-deploy/
          cd temp/backend-deploy && zip -r ../../backend.zip . && cd ../..

      - name: 📤 Upload backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend.zip"
          target: "~/"
          overwrite: true

      - name: 🔧 Build & restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Persistent uploads dir
            mkdir -p /root/uploads

            # Migrate any old uploads
            if [ -d /root/backend-src/storage/uploads ]; then
              mv /root/backend-src/storage/uploads/* /root/uploads/ 2>/dev/null || true
            fi

            unzip -o ~/backend.zip -d ~/backend-src
            cd ~/backend-src

            # Point UPLOAD_DIR to persistent directory
            grep -q 'UPLOAD_DIR' .env && sed -i 's|UPLOAD_DIR=.*|UPLOAD_DIR=/root/uploads|' .env || echo 'UPLOAD_DIR=/root/uploads' >> .env

            npm install --production=false
            npx prisma generate
            npx prisma db push
            npm run build

            # Reload PM2 using ecosystem.config.js so all env vars (incl. IMAP, VAPID)
            # are re-read from .env and NODE_ENV=production is guaranteed.
            # startOrReload: starts fresh if not running, reloads (0-downtime) if already up.
            pm2 startOrReload ecosystem.config.js --update-env

            # Deploy latest Nginx config (includes X-Robots-Tag noindex header)
            cp ~/backend-src/nginx-trichology.conf /etc/nginx/sites-available/trichology
            nginx -t && systemctl reload nginx

            echo "✅ Backend deployed"

      # ── Frontend ───────────────────────────────────────────
      - name: 📦 Archive frontend
        run: |
          mkdir -p temp/frontend-deploy
          rsync -av --exclude='node_modules' --exclude='dist' --exclude='.git' frontend/ temp/frontend-deploy/
          cd temp/frontend-deploy && zip -r ../../frontend.zip . && cd ../..

      - name: 📤 Upload frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend.zip"
          target: "~/"
          overwrite: true

      - name: 🎨 Build & deploy frontend
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GIT_SHA,COMMIT_MSG
          script: |
            set -e

            unzip -o ~/frontend.zip -d ~/frontend-src
            cd ~/frontend-src

            # Inject build metadata (COMMIT_MSG passed as env var – safe for any characters)
            echo "VITE_APP_VERSION=${GIT_SHA}" > .env.production
            echo "VITE_APP_BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> .env.production
            SHORT_MSG=$(printf '%s' "${COMMIT_MSG}" | head -1 | cut -c1-80)
            echo "VITE_APP_COMMIT_MESSAGE=${SHORT_MSG}" >> .env.production

            npm install

            # Clean Vite cache to ensure fresh content hashes
            rm -rf node_modules/.vite dist

            npm run build

            # ── Atomic deploy: clear old assets, copy new ones ──
            rm -rf /var/www/trichology/assets/*
            cp -r dist/* /var/www/trichology/

            # Reload Nginx to pick up new index.html
            systemctl reload nginx

            echo "✅ Frontend deployed"

      # ── Health check ───────────────────────────────────────
      - name: ❤️ Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "── PM2 status ──"
            pm2 status trichology-backend

            echo ""
            echo "── Backend health ──"
            curl -sf http://localhost:3001/health > /dev/null && echo "API: ✅ OK" || echo "API: ❌ FAIL"

            echo ""
            echo "── Frontend files ──"
            ls -la /var/www/trichology/index.html
            echo "Assets count: $(ls /var/www/trichology/assets/ | wc -l)"

            echo ""
            echo "🎉 Deployment complete!"
